# Trusted release/publish boundary: canonical main -> self-hosted NAS runner -> GHCR
name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Trusted NAS image publish
    runs-on: [self-hosted, linux, x64, nas-control]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push trusted amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/bgc-buildx-cache
          cache-to: type=local,dest=/tmp/bgc-buildx-cache-new,mode=max

      - name: Rotate local build cache
        shell: bash
        run: |
          rm -rf /tmp/bgc-buildx-cache
          mv /tmp/bgc-buildx-cache-new /tmp/bgc-buildx-cache
