name: Temporary PR CI

on:
  push:
    branches: [feature/personal-library-foundation-20261008]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run regression suite
        run: python -m pytest -q tests --ignore=tests/e2e

  e2e:
    name: Playwright UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Run Playwright suite
        run: python -m pytest -q tests/e2e/test_ui.py
