name: NAS bridge

on:
  push:
    branches:
      - ops/nas-bridge-bootstrap
    paths:
      - '.github/workflows/nas-bridge.yml'
      - 'ops/nas-bridge/request.txt'

permissions:
  contents: write

concurrency:
  group: boardgamecompanion-nas-bridge
  cancel-in-progress: true

jobs:
  bridge:
    name: NAS bridge
    runs-on: [self-hosted, linux, x64, boardgamecompanion-nas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request='ops/nas-bridge/request.txt'
          test -f "$request"
          operation="$(grep -E '^operation=' "$request" | tail -1 | cut -d= -f2-)"
          branch="$(grep -E '^branch=' "$request" | tail -1 | cut -d= -f2- || true)"
          expected_head="$(grep -E '^expected_head=' "$request" | tail -1 | cut -d= -f2- || true)"
          case "$operation" in
            inspect|inspect_runtime|publish_branch) ;;
            *) echo "Unsupported operation: $operation" >&2; exit 2 ;;
          esac
          if [[ "$operation" == publish_branch ]]; then
            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch" >&2; exit 2; }
            [[ ! "$branch" =~ (^|/)\.\.(/|$) ]] || { echo "Invalid branch traversal" >&2; exit 2; }
            [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_head must be a full SHA-1" >&2; exit 2; }
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "expected_head=$expected_head" >> "$GITHUB_OUTPUT"

      - name: Inspect NAS local checkout
        id: nas
        shell: bash
        run: |
          set -euo pipefail
          repo='/nas/repo'
          if [[ ! -d "$repo/.git" ]]; then
            echo "nas_local_repo=NOT_MOUNTED"
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global --add safe.directory "$repo"
          current_branch="$(git -C "$repo" branch --show-current)"
          current_head="$(git -C "$repo" rev-parse HEAD)"
          porcelain="$(git -C "$repo" status --porcelain=v1)"
          remote="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
          echo "nas_local_repo=MOUNTED_READ_ONLY"
          echo "nas_current_branch=$current_branch"
          echo "nas_current_head=$current_head"
          echo "nas_origin=$remote"
          if [[ -z "$current_branch" ]]; then
            github_branch_head=""
            sync_state="DETACHED"
          else
            remote_line="$(git ls-remote origin "refs/heads/$current_branch" 2>/dev/null || true)"
            github_branch_head="$(printf '%s\n' "$remote_line" | awk '{print $1}')"
            if [[ -z "$remote_line" ]]; then
              sync_state="LOCAL_ONLY_OR_REMOTE_UNAVAILABLE"
            elif [[ "$github_branch_head" == "$current_head" ]]; then
              sync_state="IN_SYNC"
            else
              sync_state="DRIFT"
            fi
          fi
          echo "github_branch_head=${github_branch_head:-NONE}"
          echo "nas_github_sync=$sync_state"
          if [[ -n "$porcelain" ]]; then
            echo "nas_worktree=DIRTY"
          else
            echo "nas_worktree=CLEAN"
          fi
          echo "mounted=true" >> "$GITHUB_OUTPUT"
          echo "current_branch=$current_branch" >> "$GITHUB_OUTPUT"
          echo "current_head=$current_head" >> "$GITHUB_OUTPUT"
          if [[ -n "$porcelain" ]]; then echo "clean=false" >> "$GITHUB_OUTPUT"; else echo "clean=true" >> "$GITHUB_OUTPUT"; fi

      - name: Inspect BoardGameCompanion runtime
        if: steps.request.outputs.operation == 'inspect_runtime'
        shell: bash
        run: |
          set -euo pipefail
          name='boardgamecompanion'
          if ! command -v docker >/dev/null 2>&1; then
            echo "runtime_docker=UNAVAILABLE"
            exit 0
          fi
          if ! docker inspect "$name" >/dev/null 2>&1; then
            echo "runtime_container=NOT_FOUND"
            echo "matching_containers:"
            docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep -i 'boardgame' || true
            exit 0
          fi

          echo "runtime_container=FOUND"
          docker inspect "$name" --format 'container_name={{.Name}}'
          docker inspect "$name" --format 'container_image_ref={{.Config.Image}}'
          docker inspect "$name" --format 'container_image_id={{.Image}}'
          docker inspect "$name" --format 'container_status={{.State.Status}}'
          docker inspect "$name" --format 'container_started_at={{.State.StartedAt}}'
          docker inspect "$name" --format 'container_restart={{.HostConfig.RestartPolicy.Name}}'
          docker inspect "$name" --format 'container_network_mode={{.HostConfig.NetworkMode}}'
          echo "container_ports:"
          docker port "$name" || true
          echo "container_mounts:"
          docker inspect "$name" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Mode}}){{println}}{{end}}'
          echo "container_labels:"
          docker inspect "$name" --format '{{range $k,$v := .Config.Labels}}{{println $k "=" $v}}{{end}}' |
            grep -E '^(com\.docker\.compose\.|net\.unraid\.|org\.opencontainers\.)' || true

          echo "rag_environment_presence:"
          docker exec "$name" python - <<'PY'
          import os
          keys = [
              "BGC_OLLAMA_URL",
              "BGC_OLLAMA_EMBEDDING_MODEL",
              "BGC_OLLAMA_GENERATION_MODEL",
              "BGC_OLLAMA_EMBEDDING_DIMENSIONS",
              "BGC_OLLAMA_VERIFY_TLS",
          ]
          for key in keys:
              value = os.getenv(key)
              print(f"{key}={'SET' if value not in (None, '') else 'UNSET'}")
          PY

          echo "application_health:"
          docker exec "$name" python - <<'PY'
          import json, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8787/health", timeout=5) as r:
                  print(f"health_status={r.status}")
                  payload = json.load(r)
                  print("health_payload=" + json.dumps(payload, sort_keys=True))
          except Exception as exc:
              print("health_error=" + type(exc).__name__ + ":" + str(exc))
          PY

          echo "ollama_runtime_probe:"
          docker exec "$name" python - <<'PY'
          import json, os, urllib.request
          base = (os.getenv("BGC_OLLAMA_URL") or "").rstrip("/")
          embed = os.getenv("BGC_OLLAMA_EMBEDDING_MODEL") or ""
          generate = os.getenv("BGC_OLLAMA_GENERATION_MODEL") or ""
          print("ollama_configured=" + ("yes" if base else "no"))
          print("embedding_model_configured=" + ("yes" if embed else "no"))
          print("generation_model_configured=" + ("yes" if generate else "no"))
          if not base:
              raise SystemExit(0)
          try:
              with urllib.request.urlopen(base + "/api/tags", timeout=8) as r:
                  payload = json.load(r)
              names = sorted(
                  str(item.get("name", ""))
                  for item in payload.get("models", [])
                  if item.get("name")
              )
              print("ollama_reachable=yes")
              print("ollama_models=" + ",".join(names))
              print("embedding_model_present=" + ("yes" if embed in names else "no"))
              print("generation_model_present=" + ("yes" if generate in names else "no"))
          except Exception as exc:
              print("ollama_reachable=no")
              print("ollama_error=" + type(exc).__name__ + ":" + str(exc))
          PY

          echo "local_latest_image:"
          image_ref="$(docker inspect "$name" --format '{{.Config.Image}}')"
          if docker image inspect "$image_ref" >/dev/null 2>&1; then
            docker image inspect "$image_ref" --format 'local_image_id={{.Id}}'
            docker image inspect "$image_ref" --format 'local_image_created={{.Created}}'
            docker image inspect "$image_ref" --format 'local_image_repo_digests={{join .RepoDigests ","}}'
          else
            echo "local_image=NOT_FOUND"
          fi

      - name: Publish exact committed local branch
        if: steps.request.outputs.operation == 'publish_branch'
        env:
          REQUEST_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          NAS_MOUNTED: ${{ steps.nas.outputs.mounted }}
          NAS_CURRENT_BRANCH: ${{ steps.nas.outputs.current_branch }}
          NAS_CURRENT_HEAD: ${{ steps.nas.outputs.current_head }}
          NAS_CLEAN: ${{ steps.nas.outputs.clean }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='/nas/repo'
          [[ "$NAS_MOUNTED" == true ]] || { echo "No local checkout mounted; refusing publish." >&2; exit 4; }
          [[ "$NAS_CLEAN" == true ]] || { echo "Local worktree dirty; refusing publish." >&2; exit 4; }
          [[ "$NAS_CURRENT_BRANCH" == "$REQUEST_BRANCH" ]] || { echo "Local branch mismatch." >&2; exit 4; }
          [[ "$NAS_CURRENT_HEAD" == "$EXPECTED_HEAD" ]] || { echo "Local HEAD mismatch." >&2; exit 4; }
          [[ "$(git -C "$repo" rev-parse "refs/heads/$REQUEST_BRANCH")" == "$EXPECTED_HEAD" ]] || { echo "Local branch ref mismatch." >&2; exit 4; }

          scratch="$RUNNER_TEMP/local-publish"
          rm -rf "$scratch"
          git clone --no-local "$repo" "$scratch"
          git -C "$scratch" checkout --detach "$EXPECTED_HEAD"
          [[ "$(git -C "$scratch" rev-parse HEAD)" == "$EXPECTED_HEAD" ]] || { echo "Scratch SHA mismatch." >&2; exit 5; }

          remote_before="$(git ls-remote "https://github.com/golgoth85/boardgamecompanion.git" "refs/heads/$REQUEST_BRANCH" | awk '{print $1}')"
          if [[ -n "$remote_before" && "$remote_before" != "$EXPECTED_HEAD" ]]; then
            echo "Remote branch differs: $remote_before; no force-push attempted." >&2
            exit 6
          fi
          if [[ "$remote_before" != "$EXPECTED_HEAD" ]]; then
            git -C "$scratch" push "https://x-access-token:$GH_TOKEN@github.com/golgoth85/boardgamecompanion.git" "$EXPECTED_HEAD:refs/heads/$REQUEST_BRANCH"
          fi
          remote_after="$(git ls-remote "https://github.com/golgoth85/boardgamecompanion.git" "refs/heads/$REQUEST_BRANCH" | awk '{print $1}')"
          [[ "$remote_after" == "$EXPECTED_HEAD" ]] || { echo "Remote verification failed." >&2; exit 7; }
          echo "published_branch=$REQUEST_BRANCH"
          echo "published_sha=$remote_after"
