name: Local CI (solo manuale, ripiego)

# La Local CI automatica delle PR la esegue il poller lato NAS di nas-control
# (status di commit `localci/pytest-browser-v1`). Questo workflow non parte piu' da solo.
# Il vecchio percorso `pull_request_target` -> `localci-dispatch` dipendeva da
# `github.event.pull_request.*` (numero, SHA di testa, repo e ID numerico): con
# `workflow_dispatch` questi dati non esistono e ricavarli richiederebbe
# permessi nuovi. Per questo il job non invoca il dispatcher: segnala solo
# come rilanciare la CI. Il rilancio di un `error` si fa con l'etichetta
# `localci-rerun` sulla PR.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: local-ci-manuale
  cancel-in-progress: false

jobs:
  avviso:
    name: Local CI automatica gestita dal poller NAS
    runs-on: [self-hosted, linux, x64, localci-dispatcher]
    timeout-minutes: 5
    steps:
      - name: Indicazioni
        shell: bash
        run: |
          echo "Nessuna validazione eseguita: la Local CI delle PR la fa il poller lato NAS (status localci/pytest-browser-v1)."
          echo "Per rilanciare un esito 'error' applicare l'etichetta localci-rerun alla PR."
          exit 1
