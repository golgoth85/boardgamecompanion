name: Local CI

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: local-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.pull_request.draft == false
    name: Universal Local CI / exact PR head
    runs-on: [self-hosted, linux, x64, localci-dispatcher]
    timeout-minutes: 50
    steps:
      - name: Validate exact PR head in Universal Local CI
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
        run: /usr/local/bin/localci-dispatch
