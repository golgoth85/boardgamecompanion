name: Temporary PR CI

# Temporary GitHub-hosted runner authorized for BoardGameCompanion PR #109 only.
on:
  push:
    branches:
      - feature/personal-library-foundation-20261008

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  BGC_CONFIG_DIR: ${{ runner.temp }}/bgc-config
  BGC_IMPORT_DIR: ${{ runner.temp }}/bgc-import
  BGC_MANUALS_DIR: ${{ runner.temp }}/bgc-manuals

jobs:
  test-pr-109:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare writable app directories
        run: mkdir -p "$BGC_CONFIG_DIR" "$BGC_IMPORT_DIR" "$BGC_MANUALS_DIR"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Run full test suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/bgc-pytest.log

      - name: Report result to PR #109
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "### Temporary GitHub-hosted CI"
            echo
            echo "- tested ref: feature/personal-library-foundation-20261008"
            echo "- checkout SHA: $(git rev-parse HEAD)"
            echo "- pytest outcome: **$TEST_OUTCOME**"
            echo
            echo "<details><summary>pytest tail</summary>"
            echo
            echo '~~~text'
            tail -n 120 /tmp/bgc-pytest.log || true
            echo '~~~'
            echo "</details>"
          } > /tmp/pr-comment.md
          gh pr comment 109 --repo golgoth85/boardgamecompanion --body-file /tmp/pr-comment.md

      - name: Fail workflow when tests fail
        if: steps.tests.outcome != 'success'
        run: exit 1
