name: Temporary PR CI

# Temporary GitHub-hosted runner authorized for BoardGameCompanion PR #109 only.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.number == 109 && github.head_ref == 'feature/personal-library-foundation-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Run full test suite
        run: pytest -q
